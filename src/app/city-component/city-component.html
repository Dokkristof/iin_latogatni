<p>Települések</p>

<table class="table table-stripped">
    <thead>
        <tr>
            <th>id</th>
            <th>Név</th>
            <th>Megye</th>
            <th>Terület (km<sup>2</sup>)</th>
            <th>Népesség (fő)</th>
        </tr>
    </thead>
    <tbody>
        @for( city of cities ; track city.id ) {
            <tr>
                <td>{{city.id}}</td>
                <td>{{city.name}}</td>
                <td>{{city.country}}</td>
                <td>{{city.area}}</td>
                <td>{{city.population}}</td>
            </tr>
        }
    </tbody>
</table>
